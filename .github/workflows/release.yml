name: Release

# Cut a release by pushing a semver tag (vMAJOR.MINOR.PATCH), or run manually.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true

# Default: read-only. The publish job elevates to contents: write.
permissions:
  contents: read

jobs:
  verify:
    name: Verify quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  release:
    name: Build package & publish release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job needs to create the release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # From 2.0.0 the store package includes Hamesh Teams. Both values are
      # public (an origin and an OAuth client id, both visible in any installed
      # copy), kept as repository *variables* — not secrets — so they never
      # live in the source. A release without them would silently ship without
      # Teams, so it stops instead.
      - name: Build production extension package
        env:
          WXT_TEAMS_API_ORIGIN: ${{ vars.WXT_TEAMS_API_ORIGIN }}
          WXT_GOOGLE_CLIENT_ID: ${{ vars.WXT_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$WXT_TEAMS_API_ORIGIN" ] || [ -z "$WXT_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Set the repository variables WXT_TEAMS_API_ORIGIN and WXT_GOOGLE_CLIENT_ID (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          pnpm zip
          grep -q '"sidePanel"' .output/chrome-mv3/manifest.json \
            || { echo "::error::The package was built without Teams."; exit 1; }

      - name: Resolve tag, artifact & notes
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ZIP=$(ls .output/*-chrome.zip | head -n1)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "sha256=$ZIP.sha256" >> "$GITHUB_OUTPUT"
          # Extract just this version's section from the changelog.
          awk -v ver="$VERSION" '
            /^## \[/ { if (p) exit }
            index($0, "## [" ver "]") == 1 { p=1 }
            p { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release $TAG" > notes.md; fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.meta.outputs.zip }}" \
            "${{ steps.meta.outputs.sha256 }}" \
            --title "${{ steps.meta.outputs.tag }}" \
            --notes-file notes.md \
            --verify-tag
