<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>إيقاف دعوات هامش · Stop Hamesh invitations</title>
    <meta name="description" content="Stop Hamesh from emailing you team invitations." />
    <!-- The token is in the address's fragment. It leaves this page only in the
         one request the reader asks for, and no other site hears where they came from. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="../assets/favicon.ico" sizes="32x32" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --ink: #1e1b18;
        --ink-60: rgba(30, 27, 24, 0.62);
        --paper: #f7f3ec;
        --surface: #ffffff;
        --accent: #b5502f;
        --on-accent: #ffffff;
        --success: #4b6b4e;
        --danger: #8c2f27;
        --border: rgba(30, 27, 24, 0.14);
        --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --arabic: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f3ede3;
          --ink-60: rgba(243, 237, 227, 0.64);
          --paper: #16140f;
          --surface: #262219;
          --accent: #e08b5c;
          --on-accent: #16140f;
          --success: #8fb894;
          --danger: #e08378;
          --border: rgba(243, 237, 227, 0.16);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.65;
      }
      html[dir='rtl'] body {
        font-family: var(--arabic);
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 48px 20px;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 32px;
      }
      .mark {
        flex: none;
        color: var(--accent);
      }
      .lang {
        margin-inline-start: auto;
        padding: 4px 12px;
        background: none;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 26px;
        line-height: 1.3;
      }
      .lead {
        margin: 0 0 24px;
        color: var(--ink-60);
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding: 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .btn {
        display: inline-block;
        padding: 9px 16px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      .btn[aria-busy='true'] {
        opacity: 0.7;
        cursor: progress;
      }
      .status {
        margin: 0;
      }
      .status:empty {
        display: none;
      }
      .status--done {
        color: var(--success);
        font-weight: 500;
      }
      .status--error {
        color: var(--danger);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .note {
        margin: 24px 0 0;
        color: var(--ink-60);
        font-size: 14px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <svg class="mark" width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
            <path d="M10 5V27" />
            <path d="M10 14H20" />
            <path d="M20 10.5V17.5" />
          </g>
        </svg>
        <strong data-ar="هامش" data-en="Hamesh">هامش</strong>
        <button type="button" class="lang" id="langToggle" lang="en">EN</button>
      </div>

      <h1 data-ar="إيقاف دعوات هامش" data-en="Stop Hamesh invitations">إيقاف دعوات هامش</h1>
      <p
        class="lead"
        data-ar="اضغط الزر أدناه، ولن يرسل هامش دعوات فرق أخرى إلى العنوان الذي وصلتك عليه الرسالة. لا تحتاج إلى حساب."
        data-en="Press the button below and Hamesh won’t send any more team invitations to the address that got the email. You don’t need an account."
      >
        اضغط الزر أدناه، ولن يرسل هامش دعوات فرق أخرى إلى العنوان الذي وصلتك عليه الرسالة. لا تحتاج
        إلى حساب.
      </p>

      <div class="card">
        <button
          type="button"
          class="btn"
          id="stop"
          data-ar="إيقاف الدعوات"
          data-en="Stop invitations"
          hidden
        >
          إيقاف الدعوات
        </button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>

      <p
        class="note"
        data-ar="ما زال بإمكان من يدعوك أن يرسل إليك رابط الدعوة بنفسه. وهذه الصفحة ترسل إلى هامش رمزًا يمثّل العنوان، لا العنوان نفسه."
        data-en="Someone who invites you can still send you the link themselves. This page sends Hamesh a code that stands for the address, never the address itself."
      >
        ما زال بإمكان من يدعوك أن يرسل إليك رابط الدعوة بنفسه. وهذه الصفحة ترسل إلى هامش رمزًا يمثّل
        العنوان، لا العنوان نفسه.
      </p>
    </main>

    <script>
      (function () {
        var STOP = 'https://api.hamesh.fandees.tech/v1/mail/stop';
        var WORDS = {
          ar: {
            done: 'تم. لن يرسل هامش دعوات أخرى إلى هذا العنوان.',
            invalid: 'هذا الرابط لا يعمل. افتح رابط الإيقاف من الرسالة نفسها.',
            incomplete: 'هذا الرابط ناقص. افتح رابط الإيقاف من الرسالة نفسها.',
            busy: 'محاولات كثيرة. انتظر دقيقة ثم حاول مرة أخرى.',
            offline: 'تعذّر الوصول إلى هامش. تحقّق من اتصالك وحاول مرة أخرى.',
          },
          en: {
            done: 'Done. Hamesh won’t email this address any more invitations.',
            invalid: 'This link doesn’t work. Open the “stop” link from the email itself.',
            incomplete: 'This link is incomplete. Open the “stop” link from the email itself.',
            busy: 'Too many tries. Wait a minute and try again.',
            offline: 'We couldn’t reach Hamesh. Check your connection and try again.',
          },
        };
        var html = document.documentElement;
        var toggle = document.getElementById('langToggle');
        var button = document.getElementById('stop');
        var status = document.getElementById('status');
        var nodes = document.querySelectorAll('[data-ar]');
        var shown = null;

        // Read once, then taken out of the address bar and the history.
        var match = /^#([0-9a-f]{64}\.[A-Za-z0-9_-]{43})$/.exec(location.hash);
        var token = match ? match[1] : null;
        if (location.hash) history.replaceState(null, '', location.pathname);

        function say(key) {
          shown = key;
          status.textContent = key ? WORDS[html.lang][key] : '';
          status.className =
            'status' + (key === 'done' ? ' status--done' : key ? ' status--error' : '');
        }

        function apply(lang) {
          var isAr = lang === 'ar';
          html.lang = lang;
          html.dir = isAr ? 'rtl' : 'ltr';
          nodes.forEach(function (el) {
            var val = el.getAttribute(isAr ? 'data-ar' : 'data-en');
            if (val !== null) el.textContent = val;
          });
          toggle.textContent = isAr ? 'EN' : 'ع';
          toggle.setAttribute('aria-label', isAr ? 'Switch to English' : 'التبديل إلى العربية');
          say(shown);
          try {
            localStorage.setItem('hamesh-lang', lang);
          } catch (e) {}
        }

        var saved = null;
        try {
          saved = localStorage.getItem('hamesh-lang');
        } catch (e) {}
        if (saved === 'en' || (!saved && !/^ar\b/i.test(navigator.language))) apply('en');

        toggle.addEventListener('click', function () {
          apply(html.lang === 'ar' ? 'en' : 'ar');
        });

        if (!token) {
          say('incomplete');
          return;
        }
        // Nothing is sent until the reader presses this: mail scanners open
        // links on their own, and must not stop anyone's mail by doing so.
        button.hidden = false;

        button.addEventListener('click', function () {
          if (button.getAttribute('aria-busy') === 'true') return;
          button.setAttribute('aria-busy', 'true');
          say(null);
          fetch(STOP, {
            method: 'POST',
            headers: { 'content-type': 'text/plain' },
            body: token,
            credentials: 'omit',
            cache: 'no-store',
            referrerPolicy: 'no-referrer',
          })
            .then(function (res) {
              if (res.ok) {
                button.hidden = true;
                say('done');
              } else {
                say(res.status === 429 ? 'busy' : res.status >= 500 ? 'offline' : 'invalid');
              }
            })
            .catch(function () {
              say('offline');
            })
            .then(function () {
              button.removeAttribute('aria-busy');
            });
        });
      })();
    </script>
  </body>
</html>
