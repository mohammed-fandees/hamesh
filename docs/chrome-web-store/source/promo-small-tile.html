<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Hamesh — small promo tile</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    />
    <link rel="stylesheet" href="../../../landing/css/reset.css" />
    <link rel="stylesheet" href="../../../landing/css/variables.css" />
    <link rel="stylesheet" href="../../../landing/css/base.css" />
    <style>
      /* Chrome Web Store small promo tile, 440×280 — the marquee's idea,
         made small: a ruled page, one tinted phrase, and the mark reaching
         from it into the margin, where the note is the name itself. At half
         size the page becomes texture and the mark and name still read. */
      html,
      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
      }
      body {
        --rule: 27px;
        --top: 72px;
        position: relative;
        background:
          radial-gradient(240px 180px at 100% 0%, rgb(var(--accent-rgb) / 0.1), transparent 70%),
          repeating-linear-gradient(
              to bottom,
              transparent 0 calc(var(--rule) - 1px),
              rgb(30 27 24 / 0.07) calc(var(--rule) - 1px) var(--rule)
            )
            0 calc(var(--top) - 6px) / 100% 100% no-repeat,
          var(--paper);
        font-family: var(--sans);
        color: var(--ink);
      }
      .text {
        position: absolute;
        left: 24px;
        top: var(--top);
        width: 150px;
        font-family: var(--serif);
        font-size: 15px;
        line-height: var(--rule);
        color: rgb(30 27 24 / 0.32);
      }
      .text span {
        display: block;
        white-space: nowrap;
      }
      .text .is-here {
        color: var(--ink);
      }
      mark {
        background: rgb(var(--accent-rgb) / 0.26);
        color: inherit;
        border-radius: 2px;
        box-shadow: inset 0 -1px 0 rgb(var(--accent-rgb) / 0.85);
        padding: 0 1px;
      }
      .margin-line {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: rgb(var(--accent-rgb) / 0.32);
      }
      .mark-big {
        position: absolute;
        color: var(--accent);
      }
      .name {
        position: absolute;
        display: grid;
        gap: 2px;
      }
      .name b {
        font-family: var(--serif);
        font-size: 42px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.01em;
      }
      .name small {
        font-size: 13px;
        color: var(--ink-60);
        padding-left: 2px;
      }
    </style>
  </head>
  <body>
    <div class="text" id="text">
      <span>Reading is a quiet</span>
      <span>conversation, and</span>
      <span class="is-here"><mark id="phrase">a thought lights up</mark></span>
      <span>beside the words</span>
      <span>that stopped you.</span>
    </div>

    <div class="margin-line" id="line"></div>
    <svg class="mark-big" id="mark" viewBox="0 0 32 32">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="3.2">
        <path d="M10 5V27" />
        <path d="M10 14H20" />
        <path d="M20 10.5V17.5" />
      </g>
    </svg>

    <div class="name" id="name">
      <b>Hamesh</b>
      <small>A margin for the web</small>
    </div>

    <script>
      window.place = () => {
        const S = 4; // pixels per unit of the mark's 32-unit grid
        const phrase = document.getElementById('phrase').getBoundingClientRect();
        const stemX = phrase.right + 16;
        const branchY = phrase.top + phrase.height / 2;
        const mark = document.getElementById('mark');
        Object.assign(mark.style, {
          width: `${32 * S}px`,
          height: `${32 * S}px`,
          left: `${stemX - 10 * S}px`,
          top: `${branchY - 14 * S}px`,
        });
        document.getElementById('line').style.left = `${stemX - 0.5}px`;
        const name = document.getElementById('name');
        name.style.left = `${stemX + 10 * S + 1.6 * S + 14}px`;
        // The name's own line sits on the branch, as a note sits on its mark.
        const word = name.querySelector('b').getBoundingClientRect();
        name.style.top = `${branchY - word.height / 2 - 2}px`;
      };
    </script>
  </body>
</html>
