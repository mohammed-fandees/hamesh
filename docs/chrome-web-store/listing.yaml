# Canonical, version-controlled source of truth for Chrome Web Store listing metadata.
#
# Why this file exists: Chrome Web Store API v2 has no endpoint to read or write any of
# these fields (docs/releases/RESEARCH.md §2) — every field here is Developer-Dashboard-only,
# permanently, until Google adds write support. This file cannot be "synced" to the store.
# What it IS used for: a single validated source these strings are authored/reviewed in,
# and a diff-only approval report (repo vs. previous repo release) before the owner approves
# submission. See docs/releases/adr/0001-release-architecture.md §4.
#
# Editing this file is a normal, reviewed code change — same PR process as anything else in
# the repo. It is validated by tooling/release/metadata-schema.ts (pnpm release:validate).
# After editing, the corresponding manual dashboard fields must be updated by hand
# (docs/chrome-web-store/SUBMISSION_GUIDE.md) — nothing reads this file automatically yet.

productName: 'Hamesh — Contextual Notes'

category: 'Productivity'

# Optional. Leave blank (empty string) rather than a URL that doesn't resolve.
homepageUrl: 'https://hamesh.fandees.tech'

# Optional. Where users should go for help/bug reports.
supportUrl: 'https://github.com/mohammed-fandees/hamesh/issues'

# Required whenever the extension handles any user data, even local-only (it does).
privacyPolicyUrl: 'https://hamesh.fandees.tech/privacy.html'

# Optional. The dashboard's promotional video field.
promoVideoUrl: 'https://www.youtube.com/watch?v=v-Kum8qhSUc'

# Informational only — not validated, not sent anywhere by this repo's tooling. Useful for a
# human (or a future PR's API calls) to know which Chrome Web Store item this listing is for.
# publishers/{publisherId}/items/{chromeWebStoreItemId} once PR3 wires up the API calls.
chromeWebStoreItemId: 'giajamkkehcoienhhlcfgcckahjjbgnc'

locales:
  en:
    # Mirrors the manifest's description in the Teams build (wxt.config.ts), which is what the
    # store shows as the summary.
    shortDescription: >-
      Leave a note exactly where it belongs on a web page, and find it there when you return.
      Share with your team, optionally.

    detailedDescription: |
      Hamesh gives the web a margin.

      Books and manuscripts have always had margins: a quiet place where readers leave thoughts, questions, and connections. Hamesh brings that idea to the modern web.

      Instead of losing ideas in a separate app, attach them to the exact words, paragraph, image, or line of code that inspired them, or to a specific moment in a video. When you come back, your thought is waiting exactly where you left it.

      HOW IT WORKS

      1. Select some words, or press Alt+H and click any element on the page. While watching a video, press Alt+V.
      2. Write what came to mind. It saves instantly.
      3. The words keep a faint tint, the element gets a small marker, and the clip gets a mark on its timeline.
      4. Return days or weeks later, and everything appears back in context. A clip even seeks to the right moment on its own.

      YOUR LIBRARY

      Everything you write gathers in one library.

      - Browse by website, or organize your own folders across any site.
      - Continue where you left off with recently active websites.
      - Search instantly, and pin what you return to often.
      - Edit, delete, or move anything into a folder right from the library, without reopening the original page.

      HAMESH TEAMS (OPTIONAL)

      Reading is better together. Turn on Teams to share a note with your team on the very page it belongs to, with your picture beside it. Discuss it in place with replies and @mentions, or open the whole conversation in the side panel. It uses Google sign-in and starts on a free plan.

      PRIVACY

      Your personal notes stay on your device, in your browser's own extension storage. There is no account and nothing is sent anywhere. Teams is the only exception: once you turn it on and sign in, what you share goes to our server, and nothing else. See our privacy policy for full details.

      CURRENT FEATURES

      - Notes on selected words, page elements, or a moment in a video.
      - Automatic restoration when you return.
      - A library with website grouping, folders, search, and pinning.
      - Teams: sharing with your team, discussions, and mentions.
      - Light and dark appearance options.
      - English and Arabic interfaces with RTL support.

      Hamesh is not a bookmarking tool, not a sticky-note app, and not a generic writing assistant. It is a quiet layer for thinking in context, exactly where each thought belongs.

  ar:
    shortDescription: >-
      اترك ملاحظتك حيث تنتمي بالضبط في صفحة الويب، وستجدها هناك عند عودتك. وشاركها مع فريقك
      إن أردت.

    detailedDescription: |
      هامش يمنح الويب هامشًا.

      كانت للكتب والمخطوطات هوامش دائمًا: مساحة هادئة يترك فيها القارئ أفكاره وأسئلته وروابطه. وهامش يعيد هذه الفكرة إلى الويب الحديث.

      بدل أن تضيع أفكارك في تطبيق منفصل، علّقها على الكلمات أو الفقرة أو الصورة أو سطر الكود الذي ألهمها، أو على لحظة بعينها في فيديو. وحين تعود، تجد فكرتك في مكانها تمامًا.

      كيف يعمل

      1. حدّد بعض الكلمات، أو اضغط Alt+H وانقر أي عنصر في الصفحة. وأثناء مشاهدة فيديو، اضغط Alt+V.
      2. اكتب ما خطر لك. يُحفظ فورًا.
      3. تبقى الكلمات مظلّلة بلون خفيف، ويحمل العنصر علامة صغيرة، وتظهر علامة على شريط المقطع.
      4. عُد بعد أيام أو أسابيع، فتجد كل شيء في سياقه من جديد. حتى المقطع ينتقل إلى اللحظة الصحيحة وحده.

      مكتبتك

      كل ما تكتبه يجتمع في مكتبة واحدة.

      - تصفّح حسب الموقع، أو رتّب فولدراتك الخاصة عبر أي موقع.
      - أكمل من حيث توقفت مع المواقع النشطة مؤخرًا.
      - ابحث فورًا، وثبّت ما تعود إليه كثيرًا.
      - عدّل أو احذف أو انقل أي شيء إلى فولدر من المكتبة مباشرة، دون أن تفتح الصفحة الأصلية.

      فرق هامش (اختيارية)

      القراءة أجمل مع الآخرين. فعّل الفرق لتشارك ملاحظة مع فريقك على الصفحة نفسها، وبجوارها صورتك. وتحاوروا حولها في مكانها بالردود والإشارات (@)، أو افتحوا النقاش كاملًا في اللوحة الجانبية. تعمل بتسجيل الدخول عبر Google، وتبدأ بخطة مجانية.

      الخصوصية

      ملاحظاتك الخاصة تبقى على جهازك، في تخزين المتصفح الخاص بالإضافات. لا حساب، ولا شيء يُرسل إلى أي مكان. والفرق هي الاستثناء الوحيد: بعد أن تفعّلها وتسجّل الدخول، يصل ما تشاركه أنت فقط إلى خادمنا، ولا شيء غيره. راجع سياسة الخصوصية للتفاصيل الكاملة.

      المميزات الحالية

      - تعليقات على كلمات محددة، أو عناصر الصفحة، أو لحظة في فيديو.
      - استعادة تلقائية عند عودتك.
      - مكتبة بتجميع حسب الموقع، وفولدرات، وبحث، وتثبيت.
      - الفرق: المشاركة مع فريقك، والنقاشات، والإشارات.
      - مظهر فاتح وداكن.
      - واجهات بالعربية والإنجليزية مع دعم الكتابة من اليمين لليسار.

      هامش ليس أداة إشارات مرجعية، ولا تطبيق ملاحظات لاصقة، ولا مساعد كتابة عامًا. إنه طبقة هادئة للتفكير في السياق، حيث تنتمي كل فكرة.
