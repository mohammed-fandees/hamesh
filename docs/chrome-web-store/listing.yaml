# Canonical, version-controlled source of truth for Chrome Web Store listing metadata.
#
# Why this file exists: Chrome Web Store API v2 has no endpoint to read or write any of
# these fields (docs/releases/RESEARCH.md §2) — every field here is Developer-Dashboard-only,
# permanently, until Google adds write support. This file cannot be "synced" to the store.
# What it IS used for: a single validated source these strings are authored/reviewed in,
# and a diff-only approval report (repo vs. previous repo release) before the owner approves
# submission. See docs/releases/adr/0001-release-architecture.md §4.
#
# Editing this file is a normal, reviewed code change — same PR process as anything else in
# the repo. It is validated by tooling/release/metadata-schema.ts (pnpm release:validate).
# After editing, the corresponding manual dashboard fields must be updated by hand
# (docs/chrome-web-store/SUBMISSION_GUIDE.md) — nothing reads this file automatically yet.

productName: 'Hamesh — Contextual Notes'

category: 'Productivity'

# Optional. Leave blank (empty string) rather than a URL that doesn't resolve.
homepageUrl: 'https://hamesh.fandees.tech'

# Optional. Where users should go for help/bug reports.
supportUrl: 'https://github.com/mohammed-fandees/hamesh/issues'

# Required whenever the extension handles any user data, even local-only (it does).
privacyPolicyUrl: 'https://hamesh.fandees.tech/privacy.html'

# Informational only — not validated, not sent anywhere by this repo's tooling. Useful for a
# human (or a future PR's API calls) to know which Chrome Web Store item this listing is for.
# publishers/{publisherId}/items/{chromeWebStoreItemId} once PR3 wires up the API calls.
chromeWebStoreItemId: 'giajamkkehcoienhhlcfgcckahjjbgnc'

locales:
  en:
    shortDescription: >-
      Attach a note to any element on a page. Find it restored there when you return.
      Local-only, no account.

    detailedDescription: |
      Hamesh gives the web a margin.

      Books and manuscripts have always had margins: a quiet place where readers
      leave thoughts, questions, and connections. Hamesh brings that idea to the
      modern web.

      Instead of losing ideas in a separate notes app, attach them directly to
      the exact paragraph, heading, button, or line of code that inspired them —
      or to a specific moment in a video. When you come back, your note is
      waiting exactly where you left it.

      HOW IT WORKS
      1. Activate Hamesh from the toolbar, or press Alt+H (Alt+V for a video).
      2. Click any element on the page — or, for a video, just press the
         shortcut while watching.
      3. Write your note. It saves instantly.
      4. A small marker stays attached to that element, or shows up on the
         video's timeline.
      5. Return days or weeks later, and your note appears back in context —
         a video note even seeks to the right moment automatically.

      YOUR NOTES, ORGANIZED
      As your collection grows, Hamesh automatically builds a Notes Library.
      - Browse notes grouped by website, or switch to Folders to organize them
        your own way, across any site.
      - Continue where you left off with recently active websites.
      - Search your notes instantly.
      - Pin, edit, delete, or file any note into a folder right from the
        Library — no need to reopen the original page.
      - Revisit ideas without remembering where you wrote them.

      WHO IT'S FOR
      - Designers and developers annotating a component, a design detail, or a
        line in the documentation.
      - Researchers marking exactly where an argument or a source lives.
      - Knowledge workers keeping the "why" next to the "what," across everything
        they read.
      - Students and lifelong learners leaving a trail of attention to return to.

      PRIVACY
      Hamesh stores every note locally on your device using your browser's own
      extension storage. There is no account, no backend server, and no network
      requests of any kind — nothing is transmitted, analyzed, or shared. See our
      privacy policy for full details.

      CURRENT FEATURES
      - Context-aware notes attached to page elements, or to a moment in a video.
      - Automatic note restoration.
      - Notes Library with website grouping and custom Folders.
      - A quick menu to pin, edit, delete, or move any note straight from the
        Library.
      - Continue section for recent work, plus search and pinning.
      - Light and dark appearance options.
      - English and Arabic interfaces with RTL support.

      Hamesh is not a bookmarking tool, not a sticky-note app, and not a
      generic writing assistant — it is a quiet layer for thinking in context,
      exactly where that thought belongs.

  ar:
    shortDescription: >-
      علّق ملاحظة على أي عنصر في صفحة ويب، وستجدها في مكانها عند عودتك. محلي
      بالكامل، بلا حساب.

    detailedDescription: |
      هامش يمنح الويب هامشًا.

      كانت للكتب والمخطوطات هوامش دائمًا: مساحة هادئة يترك فيها القارئ أفكاره
      وأسئلته وروابطه بأفكار أخرى. هامش يعيد هذه الفكرة إلى الويب الحديث.

      بدل ما تفقد أفكارك في تطبيق ملاحظات منفصل، علّقها مباشرة على الفقرة أو
      العنوان أو الزر أو سطر الكود اللي ألهمك — أو على لحظة محددة في فيديو. ولما
      ترجع، هتلاقي ملاحظتك في مكانها بالظبط.

      إزاي يعمل
      1. فعّل هامش من شريط الأدوات، أو اضغط Alt+H (أو Alt+V لملاحظة فيديو).
      2. انقر على أي عنصر في الصفحة — أو، للفيديو، اضغط الاختصار وانت بتتفرج.
      3. اكتب ملاحظتك. تُحفظ فورًا.
      4. تبقى علامة صغيرة ملتصقة بذلك العنصر، أو تظهر على الخط الزمني للفيديو.
      5. ارجع بعد أيام أو أسابيع، وهتلاقي ملاحظتك ظاهرة في سياقها من جديد — وحتى
         ملاحظة الفيديو بترجع للحظة الصح تلقائيًا.

      ملاحظاتك، منظّمة
      مع نمو مجموعتك، هامش بيبني تلقائيًا مكتبة ملاحظات.
      - تصفّح ملاحظاتك مجمّعة حسب الموقع، أو بدّل لوضع الفولدرات ونظّمها بطريقتك
        — عبر أي موقع.
      - استكمل من حيث توقفت مع المواقع النشطة مؤخرًا.
      - ابحث في ملاحظاتك فورًا.
      - ثبّت، أو عدّل، أو احذف، أو انقل أي ملاحظة لفولدر مباشرة من المكتبة — بلا
        حاجة لفتح الصفحة الأصلية.
      - ارجع لأفكارك بدون ما تفتكر فين كتبتها.

      لِمن هذا التطبيق
      - المصممون والمطوّرون الذين يعلّقون على مكوّن أو تفصيلة تصميم أو سطر في
        التوثيق.
      - الباحثون الذين يحدّدون بدقة مكان حجة أو مصدر.
      - العاملون في المعرفة الذين يريدون الاحتفاظ بـ"لماذا" بجانب "ماذا" في كل ما
        يقرؤونه.
      - الطلاب والمتعلّمون الذين يتركون أثرًا من انتباههم للعودة إليه.

      الخصوصية
      يحفظ هامش كل ملاحظة محليًا على جهازك باستخدام تخزين المتصفح الخاص
      بالإضافات. لا يوجد حساب، ولا خادم خلفي، ولا أي طلبات شبكة من أي نوع — لا
      شيء يُرسل أو يُحلَّل أو يُشارَك. راجع سياسة الخصوصية للتفاصيل الكاملة.

      المميزات الحالية
      - ملاحظات مرتبطة بسياقها، معلّقة على عناصر الصفحة أو على لحظة في فيديو.
      - استعادة تلقائية للملاحظات.
      - مكتبة ملاحظات بتصنيف حسب الموقع وفولدرات مخصّصة.
      - قائمة سريعة لتثبيت أو تعديل أو حذف أو نقل أي ملاحظة مباشرة من المكتبة.
      - قسم «متابعة» للعمل الأخير، بالإضافة إلى البحث والتثبيت.
      - خيارات مظهر فاتح وداكن.
      - واجهات بالعربية والإنجليزية مع دعم الكتابة من اليمين لليسار.

      هامش ليس تطبيق إشارات مرجعية، وليس تطبيق ملاحظات لاصقة، وليس مساعد كتابة
      عامًا — إنه طبقة هادئة للتفكير في السياق، تمامًا حيث تنتمي الفكرة.
